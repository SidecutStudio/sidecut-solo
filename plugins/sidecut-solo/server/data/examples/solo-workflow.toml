base_branch = "main"
merge = "ask"                    # ask | when-green | never
merge_method = "squash"          # squash | merge | rebase
required_checks = ["test", "lint"]
worktrees = "when-overlapping"   # always | when-overlapping | never
review = "auto"                  # auto | deep | light
review_model = "sonnet"          # Claude Code model for standard reviews
# codex_review_model = "gpt-6-luna"  # Codex model for standard reviews, one the host lists; unset keeps the parent's
review_effort = "medium"         # low | medium | high, both hosts
deep_review_rounds = 3           # deep reviews of the whole change before solo review refuses another
protected_paths = ["dist/", "vendor/"]
# voice_guide = "docs/voice.md"   # relative to the repo root, or an absolute path in personal settings
# Use voice_guide = "" for Solo's general writing guidance.

[checks]
test = "npm test"
lint = "npm exec --no -- biome check ."
types = "npm exec --no -- tsc --noEmit"

# Optional, only for services the project uses. A local override of "off" disables a service.
# [integrations]
