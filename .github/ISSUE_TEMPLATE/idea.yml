name: Idea
description: Something Solo should do, or do differently.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The work you were doing and where Solo got in the way or fell short.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
